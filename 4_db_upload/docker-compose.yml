services:
  neo4j_db:
    image: neo4j:5.26-bullseye
    stop_grace_period: 2m
    user: "${UID}:${GID}"
    container_name: neo4j_container
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./neo4j_data:/data
      - "~/git/SepsisEvalPipeline/3_graph_construction/data:/var/lib/neo4j/import"
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1;' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
  
  data_uploader:
    build: .
    container_name: python_uploader
    depends_on:
      neo4j_db:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j_db:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password