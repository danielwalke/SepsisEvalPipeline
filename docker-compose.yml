services:
  mlflow-server:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow_container
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow_data:/mlflow
    command: >
      mlflow server 
      --host 0.0.0.0 
      --allowed-hosts "*" 
      --backend-store-uri sqlite:////mlflow/mlflow.db 
      --serve-artifacts 
      --default-artifact-root mlflow-artifacts:/
    networks:
      mlflow-network:
        aliases:
          - mlflow-server

  mimic-preprocessor-and-sbc-extractor:
    build: 
      context: ./0_mimic_preprocess
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./mimic:/app/input
      - ./0_mimic_preprocess/preprocessed_file/${PANEL_NAME}:/app/output
      - ./0_mimic_preprocess/features:/app/features
    command: ["https://github.com/ampel-leipzig/sbcdata/raw/main/inst/extdata/sbcdata.csv.zip", "/app/output"]

  1-datapreprocess:
    build: 
      context: ./1_preprocess
    depends_on:
      mimic-preprocessor-and-sbc-extractor:
        condition: service_completed_successfully
    volumes:
      - ./0_mimic_preprocess/preprocessed_file/${PANEL_NAME}:/app/input
      - ./0_mimic_preprocess/features:/app/features
      - ./0_mimic_preprocess/extdata:/app/extdata
      - ./1_preprocess/data/preprocessed_data/${PANEL_NAME}:/app/output
      - ./config.ini:/app/config/config.ini

  2-baseline:
    build: 
      context: ./2_baseline
    depends_on:
      1-datapreprocess:
        condition: service_completed_successfully
      mlflow-server:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./1_preprocess/data/preprocessed_data/${PANEL_NAME}:/app/input
      - ./2_baseline:/app/output
      - ./config.ini:/app/config/config.ini
      - ./2_baseline/models:/app/models
    networks:
      - default
      - mlflow-network

  3-graph-construction:
    build: 
      context: ./3_graph_construction
    depends_on:
      1-datapreprocess:
        condition: service_completed_successfully
    volumes:
      - ./1_preprocess/data/preprocessed_data/${PANEL_NAME}:/app/input
      - ./3_graph_construction/data/${PANEL_NAME}:/app/output
      - ./3_graph_construction/metrics:/app/metrics
      - ./config.ini:/app/config/config.ini

  4-db-upload:
    build:
      context: ./4_db_upload
      dockerfile: sqlite/Dockerfile
    depends_on:
      3-graph-construction:
        condition: service_completed_successfully
    environment:
      - GRAPH_DIR=./3_graph_construction/data/${PANEL_NAME}

  5-gnn-training:
    build:
      context: ./5_gnn_training
      dockerfile: docker/Dockerfile
    depends_on:
      4-db-upload:
        condition: service_completed_successfully
      mlflow-server:
        condition: service_started
    networks:
      - default
      - mlflow-network

  6-graphaware:
    build:
      context: ./6_graphaware
      dockerfile: docker/Dockerfile
    depends_on:
      4-db-upload:
        condition: service_completed_successfully
      mlflow-server:
        condition: service_started
    networks:
      - default
      - mlflow-network

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"
  mlflow-network:
    name: mlflow-network
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"